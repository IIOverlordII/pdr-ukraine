<title>Психопрофиль переехал</title>
<script>
  // Psychoprofile moved out of the PDR scope; keep #/import/... share links working.
  var TARGET = 'https://iioverlordii.github.io/The-connection-between-us/';
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { if (/\/pdr-ukraine\/psy\/$/.test(r.scope)) r.unregister(); });
    }).catch(function () {});
  }
  location.replace(TARGET + location.hash);
</script>
